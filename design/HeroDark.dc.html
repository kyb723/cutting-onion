<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Archivo:wght@400;500;600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F4501B; text-decoration: none; }
    a:hover { color: #C93A0F; }

    .hero {
      --orange: #F4501B; --deep: #C93A0F; --ink: #14100D;
      --paper: #F6EFE1; --paper-hi: #FCF8EF;
      --disp: 'Rammetto One', 'Arial Black', sans-serif;
      --body: 'Archivo', 'Noto Sans HK', system-ui, sans-serif;
      --han: 'Noto Sans HK', 'PingFang HK', system-ui, sans-serif;
      position: relative; width: 1440px; height: 860px; overflow: hidden;
      font-family: var(--body); cursor: crosshair;
    }
    .hero[data-theme="dark"]  { --bg: #0E0B09; --fg: #F6EFE1; --fg-dim: rgba(246,239,225,.6); --hair: rgba(246,239,225,.2); }
    .hero[data-theme="paper"] { --bg: #F6EFE1; --fg: #14100D; --fg-dim: rgba(20,16,13,.62); --hair: rgba(20,16,13,.2); }
    .hero { background: var(--bg); color: var(--fg); }

    .disp { font-family: var(--disp); font-weight: 400; text-transform: uppercase; line-height: .9; }
    .han { font-family: var(--han); }
    .lbl { font-weight: 800; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; }

    /* layers */
    .centre { position: absolute; left: 50%; top: 47%; transform: translate(-50%,-50%); z-index: 1; }
    #onionfield { position: absolute; inset: 0; z-index: 2; display: block; pointer-events: none; }
    .ui { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .ui a, .ui button { pointer-events: auto; }

    /* centre: the IG icon, nothing else */
    .ig { display: block; width: 400px; height: 400px; border-radius: 50%; background: var(--orange); overflow: hidden; }
    .ig img { display: block; width: 404px; height: 404px; margin: -2px 0 0 -2px; }

    /* nav */
    .nav { position: absolute; left: 0; right: 0; top: 0; height: 78px; display: flex; align-items: center; gap: 38px; padding: 0 60px; border-bottom: 2px solid var(--hair); }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-disc { width: 42px; height: 42px; border-radius: 50%; background: var(--orange); overflow: hidden; flex: none; }
    .brand-disc img { width: 42px; height: 42px; display: block; }
    .brand b { font-family: var(--disp); font-weight: 400; font-size: 17px; line-height: 1; }
    .links { display: flex; gap: 26px; margin-left: 14px; }
    .links a { color: var(--fg); font-family: var(--han); font-weight: 700; font-size: 14px; letter-spacing: .1em; }
    .links a:hover { color: var(--orange); }
    .nav-r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .sw { display: flex; border: 2.5px solid var(--fg); border-radius: 999px; overflow: hidden; }
    .sw span { font-weight: 800; font-size: 12px; padding: 7px 14px; line-height: 1.3; }
    .sw span.on { background: var(--fg); color: var(--bg); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 24px; border: 3px solid var(--ink); border-radius: 999px; background: var(--orange); color: var(--paper-hi); font-family: var(--han); font-weight: 900; font-size: 14px; box-shadow: 4px 4px 0 var(--ink); transition: transform .18s ease, box-shadow .18s ease; }
    .hero[data-theme="dark"] .btn { border-color: var(--paper-hi); box-shadow: 4px 4px 0 var(--paper-hi); }
    .btn:hover { transform: translate(2px,2px); box-shadow: 1px 1px 0 currentColor; }
    .btn.ghost { background: transparent; color: var(--fg); }
    .btn.sm { padding: 10px 18px; font-size: 13px; box-shadow: 3px 3px 0 var(--ink); }
    .hero[data-theme="dark"] .btn.sm { box-shadow: 3px 3px 0 var(--paper-hi); }

    /* copy */
    .copy { position: absolute; left: 60px; bottom: 62px; width: 620px; }
    .copy::before { content: ""; position: absolute; left: -120px; right: -80px; top: -90px; bottom: -110px; z-index: -1; background: radial-gradient(58% 62% at 34% 62%, var(--bg) 0%, transparent 72%); }
    .kick { display: flex; align-items: center; gap: 11px; color: var(--orange); }
    .kick i { display: block; width: 34px; height: 3px; background: var(--orange); }
    .copy h1 { margin: 16px 0 0; font-family: var(--han); font-weight: 900; font-size: 118px; line-height: .92; letter-spacing: .02em; }
    .copy .en { margin-top: 6px; font-family: var(--disp); font-size: 25px; color: var(--orange); }
    .copy p { margin: 22px 0 0; max-width: 470px; font-family: var(--han); font-size: 16px; line-height: 1.85; color: var(--fg-dim); }
    .cta { display: flex; gap: 14px; margin-top: 30px; }

    /* hint */
    .hint { position: absolute; right: 60px; bottom: 62px; width: 250px; text-align: right; transition: opacity .5s ease; }
    .hint .row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    .hint b { font-family: var(--han); font-weight: 900; font-size: 17px; }
    .hint .en2 { margin-top: 5px; font-family: var(--disp); font-size: 11px; color: var(--fg-dim); }
    .hint .cnt { margin-top: 16px; padding-top: 14px; border-top: 2px solid var(--hair); font-family: var(--disp); font-size: 13px; color: var(--orange); }
    .knife { transform: rotate(8deg); }
    .scroll { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; color: var(--fg-dim); }
    .scroll .lbl { font-size: 10px; }

    @media (prefers-reduced-motion: reduce) { .disc { transition: none; } }
  </style>
</helmet>

<div class="hero" id="hero" data-theme="dark">

  <div class="centre" id="centre">
    <span class="ig"><img src="logo-face.png" alt="Cutting Onions"></span>
  </div>

  <canvas id="onionfield"></canvas>

  <div class="ui">
    <div class="nav">
      <div class="brand">
        <span class="brand-disc"><img src="logo-face.png" alt=""></span>
        <b>Cutting<br>Onions</b>
      </div>
      <div class="links">
        <a href="#">故事</a>
        <a href="#">餐牌</a>
        <a href="#">相片</a>
        <a href="#">到訪</a>
      </div>
      <div class="nav-r">
        <span class="sw"><span class="on han">中文</span><span>EN</span></span>
        <a href="#" class="btn sm">訂枱</a>
      </div>
    </div>

    <div class="copy">
      <div class="kick lbl han"><i></i>香港 · [地區] · [年份] 開業</div>
      <h1 class="han">唔好喊</h1>
      <div class="en disp">Please don’t cry</div>

      <div class="cta">
        <a href="#" class="btn han">睇餐牌</a>
        <a href="#" class="btn ghost han">訂枱</a>
      </div>
    </div>

    <div class="hint" id="hint">
      <div class="row">
        <b class="han">拖曳，切啲洋蔥</b>
        <svg class="knife" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M3 4v13l4-4 3 6 3-1.4-3-6h6L3 4Z" fill="currentColor"></path>
        </svg>
      </div>
      <div class="en2">Drag to cut</div>
      <div class="cnt disp" id="cnt">Cut 0</div>

    <div class="scroll">
      <span class="lbl han">向下捲</span>
      <svg width="14" height="18" viewBox="0 0 14 18" fill="none" aria-hidden="true"><path d="M7 1v15M2 11l5 5 5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "density": {"editor": "range", "default": 74, "min": 30, "max": 120, "step": 2, "section": "Hero"},
  "$preview": {"width": 1440, "height": 860}
}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }

  componentDidMount() {
    this._tries = 0;
    this._tick = this._tick.bind(this);
    this._boot = this._boot.bind(this);
    this._boot();
  }

  componentDidUpdate() {
    if (this._cv) { this._palette(); this._seed(); }
  }

  componentWillUnmount() {
    this._dead = true;
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._to) clearTimeout(this._to);
    if (this._hero && this._onMove) {
      this._hero.removeEventListener('pointermove', this._onMove);
      this._hero.removeEventListener('pointerleave', this._onLeave);
    }
  }

  /* ---------- boot ---------- */

  _boot() {
    if (this._dead) return;
    var cv = document.getElementById('onionfield');
    var hero = document.getElementById('hero');
    if (!cv || !hero || !hero.clientWidth) {
      if (this._tries++ < 80) this._to = setTimeout(this._boot, 90);
      return;
    }
    this._cv = cv; this._hero = hero; this._ctx = cv.getContext('2d');
    this._centre = document.getElementById('centre');
    this._cnt = document.getElementById('cnt');
    this._hint = document.getElementById('hint');
    this._cuts = 0; this._revealed = false;
    this._px = -999; this._py = -999; this._lx = -999; this._ly = -999;
    this._trail = [];

    this._palette();
    this._resize();
    this._seed();

    var self = this;
    this._onMove = function (e) {
      var r = self._cv.getBoundingClientRect();
      self._px = e.clientX - r.left;
      self._py = e.clientY - r.top;
      self._moved = true;
    };
    this._onLeave = function () { self._px = -999; self._py = -999; self._lx = -999; self._ly = -999; };
    hero.addEventListener('pointermove', this._onMove);
    hero.addEventListener('pointerleave', this._onLeave);

    var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    this._reduced = !!(rm && rm.matches);
    if (this._reduced) { for (var i = 0; i < 200; i++) this._step(); this._paint(); }
    else this._raf = requestAnimationFrame(this._tick);
  }

  _palette() {
    this._line = '#0E0B09';
    this._skins = [
      { fill: '#F4501B', vein: 'rgba(14,11,9,.5)',  ring: '#FCF8EF' },
      { fill: '#F4501B', vein: 'rgba(14,11,9,.5)',  ring: '#FCF8EF' },
      { fill: '#F6EFE1', vein: 'rgba(14,11,9,.34)', ring: '#F4501B' },
      { fill: '#C93A0F', vein: 'rgba(14,11,9,.5)',  ring: '#FCF8EF' }
    ];
  }

  _resize() {
    var cv = this._cv;
    var w = this._hero.clientWidth, h = this._hero.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    this._ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.W = w; this.H = h; this.CX = w / 2; this.CY = h * 0.47;
  }

  _seed() {
    var n = Math.round(this.props.density || 74);
    this.onions = []; this.halves = []; this.tears = [];
    for (var i = 0; i < n; i++) this.onions.push(this._make(true));
  }

  _make(initial) {
    var a = Math.random() * Math.PI * 2;
    var d = initial ? Math.pow(Math.random(), 0.62) * 330 : 520 + Math.random() * 180;
    var r = 22 + Math.pow(Math.random(), 1.7) * 46;
    var s = this._skins[Math.floor(Math.random() * this._skins.length)];
    return {
      x: this.CX + Math.cos(a) * d * 1.45,
      y: this.CY + Math.sin(a) * d,
      vx: 0, vy: 0, r: r,
      rot: (Math.random() - 0.5) * 0.9,
      spin: (Math.random() - 0.5) * 0.012,
      fill: s.fill, vein: s.vein, ring: s.ring
    };
  }

  /* ---------- simulation ---------- */

  _step() {
    var O = this.onions, i, j, o;

    for (i = 0; i < O.length; i++) {
      o = O[i];
      var dx = this.CX - o.x, dy = this.CY - o.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var pull = d > 300 ? 0.14 : 0.05;
      o.vx += (dx / d) * pull; o.vy += (dy / d) * pull;

      if (this._px > -900) {
        var px = o.x - this._px, py = o.y - this._py;
        var pd = Math.sqrt(px * px + py * py) || 1;
        if (pd < 150) {
          var f = (1 - pd / 150) * 2.4;
          o.vx += (px / pd) * f; o.vy += (py / pd) * f;
        }
      }
      o.vx *= 0.93; o.vy *= 0.93;
      o.x += o.vx; o.y += o.vy; o.rot += o.spin;
    }

    for (i = 0; i < O.length; i++) {
      for (j = i + 1; j < O.length; j++) {
        var a = O[i], b = O[j];
        var ux = b.x - a.x, uy = b.y - a.y;
        var ud = Math.sqrt(ux * ux + uy * uy) || 1;
        var min = (a.r + b.r) * 0.94;
        if (ud < min) {
          var push = (min - ud) / ud * 0.34;
          var mx = ux * push, my = uy * push;
          a.x -= mx; a.y -= my; b.x += mx; b.y += my;
          a.rot -= 0.004; b.rot += 0.004;
        }
      }
    }

    for (i = this.halves.length - 1; i >= 0; i--) {
      var hf = this.halves[i];
      hf.vy += 0.34; hf.vx *= 0.995; hf.x += hf.vx; hf.y += hf.vy;
      hf.rot += hf.spin; hf.life -= 1;
      if (hf.life <= 0 || hf.y - hf.r > this.H + 80) this.halves.splice(i, 1);
    }
    for (i = this.tears.length - 1; i >= 0; i--) {
      var t = this.tears[i];
      t.vy += 0.42; t.x += t.vx; t.y += t.vy; t.life -= 1;
      if (t.life <= 0 || t.y > this.H + 40) this.tears.splice(i, 1);
    }

    if (O.length < Math.round(this.props.density || 74) && Math.random() < 0.028) O.push(this._make(false));
  }

  _slice() {
    var qx = this._px, qy = this._py;
    if (this._lx < -900) { this._lx = qx; this._ly = qy; return; }
    var px = this._lx, py = this._ly;
    this._lx = qx; this._ly = qy;

    var bx = qx - px, by = qy - py;
    var len = Math.sqrt(bx * bx + by * by);
    if (len < 7) return;

    this._trail.push({ x: qx, y: qy, life: 16 });
    var ux = bx / len, uy = by / len;
    var rot = Math.atan2(-ux, uy);
    var nx = Math.cos(rot), ny = Math.sin(rot);

    for (var i = this.onions.length - 1; i >= 0; i--) {
      var o = this.onions[i];
      var t = ((o.x - px) * bx + (o.y - py) * by) / (len * len);
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
      var cx = px + bx * t, cy = py + by * t;
      var ddx = o.x - cx, ddy = o.y - cy;
      if (Math.sqrt(ddx * ddx + ddy * ddy) > o.r * 0.86) continue;

      this.onions.splice(i, 1);
      for (var s = -1; s <= 1; s += 2) {
        this.halves.push({
          x: o.x + nx * o.r * 0.2 * s, y: o.y + ny * o.r * 0.2 * s,
          vx: o.vx * 0.4 + nx * s * 4.2 + ux * 1.6,
          vy: o.vy * 0.4 + ny * s * 4.2 + uy * 1.6 - 1.6,
          r: o.r, rot: rot, side: s, spin: s * (0.03 + Math.random() * 0.03),
          life: 150, fill: o.fill, ring: o.ring, vein: o.vein
        });
      }
      var nt = 1 + Math.floor(Math.random() * 2);
      for (var k = 0; k < nt; k++) {
        this.tears.push({
          x: o.x, y: o.y, vx: (Math.random() - 0.5) * 2.6, vy: -2 - Math.random() * 2,
          r: 5 + Math.random() * 4, life: 90
        });
      }
      this._cuts++;
    }

    if (this._cuts > 0 && this._hint && !this._hint._faded) {
      this._hint._faded = true; this._hint.style.opacity = '.45';
    }
    if (this._cnt) this._cnt.textContent = 'Cut ' + this._cuts;
    if (!this._revealed && this._cuts >= 14) {
      this._revealed = true;
      if (this._hint) {
        this._hint.style.opacity = '1';
        this._hint.innerHTML = '<div class="row"><b class="han">而家好啲未？</b></div>'
          + '<div class="en2">Feeling better?</div>'
          + '<div class="cnt disp">Cut ' + this._cuts + '</div>';
      }
    }
  }

  /* ---------- drawing ---------- */

  _lens(ctx, cx, cy, rx, ry, rot) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  _onion(ctx, o) {
    var r = o.r, i;
    ctx.save();
    ctx.translate(o.x, o.y); ctx.rotate(o.rot);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    /* round body, no legs */
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = o.fill; ctx.fill();
    ctx.lineWidth = Math.max(2.4, r * 0.07); ctx.strokeStyle = this._line; ctx.stroke();

    /* grain lines */
    ctx.strokeStyle = o.vein; ctx.lineWidth = Math.max(1.3, r * 0.045);
    var gx = [-0.62, -0.30, 0.30, 0.62];
    for (i = 0; i < gx.length; i++) {
      ctx.beginPath();
      ctx.moveTo(gx[i] * r * 0.30, -r * 0.90);
      ctx.quadraticCurveTo(gx[i] * r * 1.16, -r * 0.06, gx[i] * r * 0.90, r * 0.44);
      ctx.stroke();
    }

    /* knotted sprout */
    ctx.strokeStyle = this._line; ctx.lineWidth = Math.max(2, r * 0.058);
    ctx.beginPath();
    ctx.moveTo(-r * 0.20, -r * 0.97);
    ctx.quadraticCurveTo(-r * 0.34, -r * 1.36, -r * 0.02, -r * 1.18);
    ctx.quadraticCurveTo(r * 0.30, -r * 1.42, r * 0.22, -r * 1.00);
    ctx.stroke();

    /* sunglasses */
    ctx.fillStyle = this._line;
    this._lens(ctx, -r * 0.40, -r * 0.05, r * 0.36, r * 0.27, -0.13);
    this._lens(ctx,  r * 0.40, -r * 0.05, r * 0.36, r * 0.27,  0.13);
    ctx.beginPath(); ctx.rect(-r * 0.10, -r * 0.15, r * 0.20, r * 0.13); ctx.fill();

    /* arms and knife, only where there is room for them to read */
    if (r > 40) {
      ctx.strokeStyle = this._line; ctx.lineWidth = Math.max(2, r * 0.05);
      ctx.beginPath();
      ctx.moveTo(r * 0.90, r * 0.24);
      ctx.quadraticCurveTo(r * 1.16, r * 0.18, r * 1.22, r * 0.00);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 1.24, -r * 0.04, r * 0.06, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-r * 0.90, r * 0.24);
      ctx.quadraticCurveTo(-r * 1.14, r * 0.16, -r * 1.20, -r * 0.06);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-r * 1.28, -r * 0.18);
      ctx.lineTo(-r * 1.13, -r * 0.24);
      ctx.lineTo(-r * 1.19, -r * 0.72);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  _half(ctx, h) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, h.life / 42);
    ctx.translate(h.x, h.y); ctx.rotate(h.rot); ctx.scale(h.side, 1);

    ctx.beginPath();
    ctx.arc(0, 0, h.r, -Math.PI / 2, Math.PI / 2);
    ctx.closePath();
    ctx.fillStyle = h.fill; ctx.fill();
    ctx.lineWidth = Math.max(2.4, h.r * 0.07); ctx.strokeStyle = this._line; ctx.stroke();

    ctx.strokeStyle = h.ring; ctx.lineWidth = Math.max(1.8, h.r * 0.055);
    for (var k = 1; k <= 3; k++) {
      var rr = h.r * (0.24 * k + 0.05);
      ctx.beginPath();
      ctx.ellipse(0, 0, rr * 0.9, rr, 0, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(0, 0, h.r * 0.09, h.r * 0.12, 0, -Math.PI / 2, Math.PI / 2);
    ctx.fillStyle = h.ring; ctx.fill();
    ctx.restore();
  }

  _tear(ctx, t) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, t.life / 32);
    ctx.translate(t.x, t.y); ctx.rotate(Math.PI * 0.25);
    ctx.beginPath();
    ctx.moveTo(0, -t.r);
    ctx.bezierCurveTo(t.r, -t.r * 0.2, t.r * 0.78, t.r, 0, t.r);
    ctx.bezierCurveTo(-t.r * 0.78, t.r, -t.r, -t.r * 0.2, 0, -t.r);
    ctx.fillStyle = '#F4501B'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = this._line; ctx.stroke();
    ctx.restore();
  }

  _paint() {
    var ctx = this._ctx, i;
    ctx.clearRect(0, 0, this.W, this.H);

    for (i = this._trail.length - 1; i >= 0; i--) {
      this._trail[i].life -= 1;
      if (this._trail[i].life <= 0) this._trail.splice(i, 1);
    }
    if (this._trail.length > 1) {
      ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (i = 1; i < this._trail.length; i++) {
        var p = this._trail[i - 1], q = this._trail[i];
        ctx.globalAlpha = Math.min(1, q.life / 16) * 0.85;
        ctx.strokeStyle = '#F4501B';
        ctx.lineWidth = 2 + (q.life / 16) * 5;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
      ctx.restore();
    }

    for (i = 0; i < this.halves.length; i++) this._half(ctx, this.halves[i]);
    for (i = 0; i < this.onions.length; i++) this._onion(ctx, this.onions[i]);
    for (i = 0; i < this.tears.length; i++) this._tear(ctx, this.tears[i]);
  }

  _tick() {
    if (this._dead) return;
    if (this._hero.clientWidth !== this.W || this._hero.clientHeight !== this.H) this._resize();
    if (this._moved) { this._slice(); this._moved = false; }
    this._step();
    this._paint();
    this._raf = requestAnimationFrame(this._tick);
  }
}
</script>
